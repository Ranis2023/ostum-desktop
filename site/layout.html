<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$head_title</title>
  <meta name="description" content="$description">
  <meta name="theme-color" content="#1f332d">
  <link rel="canonical" href="$url">
  <link rel="alternate" hreflang="ru" href="$ru_url">
  <link rel="alternate" hreflang="en" href="$en_url">
  <link rel="alternate" hreflang="x-default" href="$ru_url">
  <link rel="sitemap" type="application/xml" href="${base}sitemap.xml">
  <link rel="alternate" type="application/atom+xml" title="OSTUM Desktop releases" href="$repo/releases.atom">
  <link rel="icon" href="${base}media/logo-96.png" type="image/png">
  <link rel="stylesheet" href="${base}style.css">
  <meta property="og:type" content="$kind">
  <meta property="og:site_name" content="OSTUM Desktop">
  <meta property="og:locale" content="$locale">
  <meta property="og:title" content="$head_title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$url">
  <meta property="og:image" content="${site}media/$card_file">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="$card_alt">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image:alt" content="$card_alt">
  <script type="application/ld+json">$structured</script>
</head>
<body>
  <a class="skip" href="#main">$skip</a>
  <header class="wrap mast">
    <a class="wordmark" href="$home_url"><img src="${base}media/logo-96.png" width="34" height="34" alt=""> OSTUM <span>Desktop</span></a>
    <nav class="head-links" aria-label="Menu">
      <a href="${home_url}#guides">$guides</a><a href="$repo">GitHub</a>
      <a class="language" href="$other_url" hreflang="$other_lang" lang="$other_lang">$other</a>
    </nav>
  </header>
  $body
  <footer class="wrap foot"><span>OSTUM Desktop</span><nav aria-label="Links"><a href="$repo">$source</a><a href="$repo/discussions">$community</a><a href="https://t.me/ranisgaliaskarov">Telegram</a></nav></footer>
</body>
</html>
